name: Package preview runtime

on:
  workflow_dispatch:
  push:
    branches:
      - arena/a5192fe1-shabdar

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build the real Axum API with development OTP support
        working-directory: apps/api
        run: |
          cargo build --locked
          strip target/debug/shabdar-api

      - name: Publish a temporary Git blob for the sandbox
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import base64, json, pathlib
          source = pathlib.Path('apps/api/target/debug/shabdar-api')
          pathlib.Path('/tmp/shabdar-blob-payload.json').write_text(json.dumps({
              'content': base64.b64encode(source.read_bytes()).decode(),
              'encoding': 'base64',
          }))
          PY
          sha=$(gh api -X POST "repos/${GH_REPO}/git/blobs" --input /tmp/shabdar-blob-payload.json --jq .sha)
          echo "::notice::PREVIEW_BLOB api-debug.bin $sha"
