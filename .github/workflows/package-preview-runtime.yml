name: Package preview runtime

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build the real Axum API
        working-directory: apps/api
        run: |
          cargo build --release --locked
          strip target/release/shabdar-api

      - name: Upload Axum binary
        uses: actions/upload-artifact@v4
        with:
          name: shabdar-api-linux-x64
          path: apps/api/target/release/shabdar-api
          retention-days: 1
          if-no-files-found: error

      - name: Export official MariaDB root filesystem
        run: |
          docker pull mariadb:10.11
          docker create --name shabdar-preview-mariadb mariadb:10.11
          docker export shabdar-preview-mariadb | gzip -1 > /tmp/mariadb-rootfs.tar.gz

      - name: Upload MariaDB root filesystem
        uses: actions/upload-artifact@v4
        with:
          name: mariadb-10.11-rootfs
          path: /tmp/mariadb-rootfs.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
